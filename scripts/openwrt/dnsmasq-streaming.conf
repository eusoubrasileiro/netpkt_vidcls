# StreamGuard - dnsmasq configuration for streaming destination tracking
#
# Place this file in /etc/dnsmasq.d/ on your OpenWrt router.
# This tells dnsmasq to add resolved IPs to the streaming_destinations nftables set.
#
# Format: nftset=/<domain>/4#<table>#<chain>#<set>
# The 4 means IPv4, the rest specifies the nft set path.

# YouTube
nftset=/youtube.com/4#inet#fw4#streaming_destinations
nftset=/youtu.be/4#inet#fw4#streaming_destinations
nftset=/googlevideo.com/4#inet#fw4#streaming_destinations
nftset=/ytimg.com/4#inet#fw4#streaming_destinations
nftset=/ggpht.com/4#inet#fw4#streaming_destinations
nftset=/youtube-nocookie.com/4#inet#fw4#streaming_destinations

# Netflix
nftset=/netflix.com/4#inet#fw4#streaming_destinations
nftset=/nflxvideo.net/4#inet#fw4#streaming_destinations
nftset=/nflximg.net/4#inet#fw4#streaming_destinations
nftset=/nflxext.com/4#inet#fw4#streaming_destinations

# TikTok
nftset=/tiktok.com/4#inet#fw4#streaming_destinations
nftset=/tiktokcdn.com/4#inet#fw4#streaming_destinations
nftset=/tiktokv.com/4#inet#fw4#streaming_destinations
nftset=/musical.ly/4#inet#fw4#streaming_destinations
nftset=/byteoversea.com/4#inet#fw4#streaming_destinations
nftset=/ibytedtos.com/4#inet#fw4#streaming_destinations

# Twitch
nftset=/twitch.tv/4#inet#fw4#streaming_destinations
nftset=/ttvnw.net/4#inet#fw4#streaming_destinations
nftset=/jtvnw.net/4#inet#fw4#streaming_destinations

# Disney+
